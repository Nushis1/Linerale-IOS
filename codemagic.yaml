# Codemagic pipeline for Linerale (iOS 27 / Swift 6.4 / Xcode 27).
# `latest` on Codemagic still resolves to Xcode 26.x, so the Xcode version is
# pinned explicitly to match the local toolchain and the Package.swift
# `swift-tools-version: 6.4` requirement.
workflows:
  ios-build:
    name: iOS — generate project, test, archive
    integration: codemagic
    trigger:
      push:
        branch_patterns:
          - pattern: main
            eq: true
      retry: 4
    environment:
      vars:
        XCODE_VERSION: "27.2"
        SWIFT_VERSION: "6.4"
        TEAM_ID: "TEAM1234"
      xcode: "27.x"
    steps:
      - name: Generate Xcode project from project.yml (XcodeGen)
        script: |
          # xcodegen is available on the Codemagic macOS image.
          xcodegen generate --spec App/project.yml
      - name: Resolve SPM dependencies
        script: |
          xcodebuild -project App/Linerale.xcodeproj -allConfigurations -resolvePackage
      - name: Run unit tests (SPM library test targets)
        script: |
          swift test --filter "LineraleDomainTests|LineraleDataTests|LineralePlaybackTests|LineraleUITests"
      - name: Build archive
        script: |
          xcodebuild -project App/Linerale.xcodeproj \
            -scheme Linerale \
            -configuration Release \
            -archivePath $PROJECT_BUILD_DIR/Linerale.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            archive
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $PROJECT_BUILD_DIR/Linerale.xcarchive \
            -exportPath $PROJECT_BUILD_DIR \
            -exportOptionsPlist scripts/exportOptions.plist
    artifacts:
      - build/**/Linerale.ipa
    publishing:
      app_store:
        submit_to_app_store: true
        skip_waiting_for_build_processing: true
        app_identifier: com.linerale.app
        apple_id: team@example.com
        team_id: TEAM1234
