# Codemagic pipeline for Linerale (iOS 27 / Swift 6.4 / Xcode 27).
#
# Add an environment variable group named `ios_creds` in the Codemagic UI
# containing: APPLE_ID, APPLE_ID_PASSWORD (app-specific), and TEAM_ID.
# Automatic provisioning (-allowProvisioningUpdates) picks a matching profile.
#
# Xcode version pins to 27.2 to match the local toolchain and the Package.swift
# `swift-tools-version: 6.4` requirement.

workflows:
  ios-build:
    name: iOS 27 — generate, test, archive, export
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      groups:
        - ios_creds
      vars:
        XCODE_SCHEME: "Linerale"
        BUNDLE_ID: "com.linerale.app"
      xcode: "27.2"

    cache:
      cache_paths:
        - ~/Library/Developer/Xcode/DerivedData

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true

    scripts:
      - name: Generate Xcode project (XcodeGen)
        script: |
          set -ex
          xcodegen generate --spec App/project.yml
      - name: Resolve SPM package dependencies
        script: |
          set -ex
          xcodebuild -project App/Linerale.xcodeproj -allConfigurations -resolvePackage
      - name: Run unit tests
        script: |
          set -ex
          swift test --filter "LineraleDomainTests|LineraleDataTests|LineralePlaybackTests|LineraleUITests"
      - name: Build archive
        script: |
          set -ex
          xcodebuild -project App/Linerale.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$PROJECT_BUILD_DIR/Linerale.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            archive
      - name: Export IPA
        script: |
          set -ex
          xcodebuild -exportArchive \
            -archivePath "$PROJECT_BUILD_DIR/Linerale.xcarchive" \
            -exportPath "$PROJECT_BUILD_DIR" \
            -exportOptionsPlist scripts/exportOptions.plist

    artifacts:
      - build/**/Linerale.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true
      email:
        recipients:
          - newros278@gmail.com
        notify:
          success: true
          failure: true
