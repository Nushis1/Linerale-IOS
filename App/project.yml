name: Linerale
options:
  bundleIdPrefix: com.linerale
  deploymentTarget:
    iOS: "27.0"
packages:
  Linerale:
    path: ..
targets:
  Linerale:
    type: application
    platform: iOS
    sources:
      - path: LineraleApp.swift
    dependencies:
      - package: Linerale
        product: LineraleUI
      - package: Linerale
        product: LineralePlayback
      - package: Linerale
        product: LineraleData
      - package: Linerale
        product: LineraleDomain
    settings:
      base:
        PRODUCT_NAME: Linerale
        PRODUCT_MODULE_NAME: LineraleApp
        PRODUCT_BUNDLE_IDENTIFIER: com.linerale.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputOnFPSKeyboard: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.4"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        ENABLE_STRICT_CONCURRENCY: complete
        SWIFT_UI_SCALE_ROOT_VIEW_CONTROLLER: YES
    scheme: {}
